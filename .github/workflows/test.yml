name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
      fail-fast: false

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  live-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run live quality regression
        run: npm run quality:live
        env:
          PATINA_API_KEY: ${{ secrets.PATINA_API_KEY }}
          PATINA_API_BASE: ${{ secrets.PATINA_API_BASE }}
          PATINA_MODEL: ${{ secrets.PATINA_MODEL }}

      - name: Upload live quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-quality-report
          path: artifacts/live-quality/
          if-no-files-found: error

      - name: Add live quality summary
        if: always()
        run: cat artifacts/live-quality/report.md >> "$GITHUB_STEP_SUMMARY"
